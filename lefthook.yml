# Lefthook git hooks. Docs: https://lefthook.dev/configuration/
# Skip with `LEFTHOOK=0 git <command>` or `git <command> --no-verify`.

pre-commit:
  # Piped so a failing step halts the rest. Format before lint: the reverse
  # order lets the formatter undo a lint fix. See STD-HOOK-2 and STD-HOOK-3 in
  # node_modules/@rcrsr/rill-dev/REPO-STANDARDS.md.
  piped: true
  commands:
    format:
      glob: '*.{ts,tsx,js,mjs,cjs,json,yaml,yml}'
      run: pnpm exec oxfmt {staged_files}
      stage_fixed: true
    lint:
      # Match the scope of the per-package `lint` scripts and CI `check:lint`,
      # which cover src/ and tests/ (STD-LINT-4).
      glob: '**/{src,tests}/**/*.{ts,tsx}'
      run: pnpm exec oxlint --config .oxlintrc.json --fix {staged_files}
      stage_fixed: true

pre-push:
  # typecheck and tests in parallel (STD-HOOK-4).
  parallel: true
  commands:
    typecheck:
      run: pnpm -r run typecheck
    test:
      run: pnpm -r run test

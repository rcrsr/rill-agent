name: Compatibility Check

# Scheduled build-and-test against the latest published versions of the
# ecosystem packages this repository consumes, so a breaking upstream release
# surfaces here before a consumer hits it. Covers @rcrsr/rill (the runtime the
# agent packages peer-depend on) and @rcrsr/rill-dev (the shared tooling and
# standards checker). See node_modules/@rcrsr/rill-dev/REPO-STANDARDS.md
# STD-CI-9.
on:
  schedule:
    - cron: '0 6 * * *' # Daily at 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compat:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Enable Corepack
        run: corepack enable

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '25'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Update ecosystem packages to latest compatible
        run: |
          pnpm -r update @rcrsr/rill
          pnpm update @rcrsr/rill-dev

      - name: Build all packages
        run: pnpm -r --filter='./packages/**' run build

      - name: Run tests
        run: pnpm -r run test
